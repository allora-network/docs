name: Check Network Version Drift

# Opens (or updates) one long-lived pull request when a network's deployed
# version has moved ahead of public/api/networks.json.
#
# Required repository secret:
#   DOCS_AUTOMATION_TOKEN  a fine-grained PAT scoped to this repository. It is
#                          mandatory: a branch pushed with the default
#                          GITHUB_TOKEN emits no `synchronize` event, so the
#                          drift PR's checks never re-run when the nightly job
#                          refreshes it. The job fails loudly when the secret is
#                          missing rather than quietly producing an unchecked PR.
#
# Three rules keep this job's write capability away from anything it does not
# trust. It runs only on the default branch (see the `guard` job). It never
# checks out the drift branch — that branch is read one file at a time and
# written by git plumbing, so nothing on it is ever executed here. And the file
# it does read decides values, never destinations: every endpoint is taken from
# the trusted checkout, so the branch cannot choose what this job fetches.

on:
  schedule:
    # Daily at 06:00 UTC, so a chain upgrade is picked up without waiting for a PR.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# One run at a time. A manual dispatch racing the scheduled one would have both
# writing the same drift branch and both calling `gh pr create`: one run's
# manifest update overwrites the other's, or the second PR creation fails.
# cancel-in-progress is false because a half-finished run leaves the branch in
# an arbitrary state -- the queued run is the one that should wait.
concurrency:
  group: networks-drift
  cancel-in-progress: false

env:
  BRANCH: networks-version-drift
  # The one file this workflow is allowed to change.
  MANIFEST: public/api/networks.json
  # The branch this workflow proposes into, and (see the `guard` job) the only
  # branch it will run from at all. Hardcoded rather than derived from the ref,
  # so the two can never disagree.
  BASE: main

jobs:
  # Everything past this gate checks the repository out and runs scripts from
  # that tree while a write-capable token is available to the job. Only the
  # default branch's tree is trusted with that combination -- it is the one that
  # cannot change without review -- so the decision is made here, in a job with
  # no credentials, no checkout and nothing to exfiltrate. GitHub only schedules
  # workflows from the default branch, so this never blocks a nightly run; a
  # dispatch from any other ref logs one line and stops.
  guard:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      trusted: ${{ steps.check.outputs.trusted }}
    steps:
    - name: Decide whether this ref may run the job
      id: check
      env:
        # Hardcoded like the pull request base, so the gate never depends on a
        # webhook payload field being present -- but cross-checked against the
        # payload when it carries one, so renaming the default branch fails
        # loudly here instead of silently disabling the automation.
        TRUSTED_BRANCH: main
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail
        if [ -n "$DEFAULT_BRANCH" ] && [ "$DEFAULT_BRANCH" != "$TRUSTED_BRANCH" ]; then
          echo "::error::This workflow trusts '$TRUSTED_BRANCH', but the repository's default branch is '$DEFAULT_BRANCH'. Update TRUSTED_BRANCH and the pull request base in the automation workflows."
          exit 1
        fi
        # The FULL ref, never github.ref_name. ref_name strips the refs/heads/
        # or refs/tags/ prefix, so a TAG named "main" presents the same string
        # as the branch and would walk straight through a ref_name comparison.
        # A tag is not the reviewed branch: it can be created by anyone who can
        # push one, and it can be moved. Only refs/heads/<trusted> is trusted.
        if [ "$GITHUB_REF" != "refs/heads/$TRUSTED_BRANCH" ]; then
          echo "trusted=false" >> "$GITHUB_OUTPUT"
          echo "Dispatched from '$GITHUB_REF', not the trusted branch ('refs/heads/$TRUSTED_BRANCH'): doing nothing. This workflow runs repository scripts with write-capable credentials in scope, which is only safe from a ref that cannot change without review."
          exit 0
        fi
        echo "trusted=true" >> "$GITHUB_OUTPUT"

  networks-drift:
    needs: guard
    if: needs.guard.outputs.trusted == 'true'
    runs-on: ubuntu-latest

    steps:
    # Checked first: failing here names the missing secret, instead of letting
    # it surface as an opaque checkout or push failure later. An expired PAT is
    # then a red run rather than an unchecked pull request.
    - name: Require the automation token
      env:
        DOCS_AUTOMATION_TOKEN: ${{ secrets.DOCS_AUTOMATION_TOKEN }}
      run: |
        set -euo pipefail
        if [ -z "$DOCS_AUTOMATION_TOKEN" ]; then
          echo "::error::The DOCS_AUTOMATION_TOKEN secret is not set. This workflow pushes a branch and opens a pull request, and a push made with the default GITHUB_TOKEN does not trigger the pull request's checks. Add the secret (a fine-grained PAT scoped to this repository) or disable this workflow."
          exit 1
        fi

    # Third-party actions are pinned to full commit SHAs: this job can write to
    # the repository, and a tag is a mutable pointer.
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        # No credentials left behind in .git/config. The drift check runs
        # between here and the push and has no business being able to write to
        # the repository; the push step supplies the PAT itself, so the token
        # exists in exactly one step's environment rather than for the whole
        # job. The push still comes from the PAT, which is what makes GitHub
        # emit the `synchronize` event that re-runs the drift PR's checks.
        persist-credentials: false
        # Full history and every branch, so the drift branch's manifest can be
        # read and a commit written on top of it without fetching again.
        fetch-depth: 0

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '20'

    # If a drift PR is already open, compare against what that PR already
    # proposes rather than against the default branch, so an unchanged chain is
    # a no-op: no commit, no push, no PR churn. It also means a reviewer's own
    # value edits on that branch -- notably the deployed_version bump the PR body
    # asks for -- are built on top of rather than discarded. Endpoints are the
    # exception, and deliberately so: an endpoint edited on the drift branch is
    # replaced with the trusted checkout's, because that is the one field the
    # branch must not be able to decide (see the merge below). Move an endpoint
    # on the default branch, not on the machine branch.
    #
    # Only the manifest crosses over, and it crosses as data: `git show` of one
    # path, into the trusted working tree. The branch itself is NEVER checked
    # out. It is a machine-owned branch that anyone with repository write access
    # can push to, so checking it out would put its scripts/, its workflows and
    # its lockfiles into the tree this job then executes from -- and the drift
    # step below runs `node ./scripts/checkNetworkDrift.js`. Everything this job
    # executes comes from the trusted checkout above; the drift branch is only
    # ever read from and written to.
    - name: Take the open drift pull request's manifest, if there is one
      id: base
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO_OWNER: ${{ github.repository_owner }}
      run: |
        set -euo pipefail
        # Captured from the TRUSTED manifest before anything is merged over it,
        # and handed to the checker below as --allowed-hosts. That makes
        # "endpoints come from the default branch" enforced where the request is
        # actually made, and not only where the merge happens -- so a gap in the
        # merge cannot reach the network by itself. (One already did.)
        node ./scripts/checkNetworkDrift.js --print-hosts "$MANIFEST" \
          > "${RUNNER_TEMP}/allowed-hosts.txt"
        echo "Hosts this run may probe: $(cat "${RUNNER_TEMP}/allowed-hosts.txt")"

        # A branch name is not an identity: anyone can open a pull request from a
        # fork whose head branch is called networks-version-drift, and a bare
        # --head lookup would count it as ours -- then build on it, edit it, and
        # push to a branch its author does not control. Only a pull request whose
        # head branch lives in this repository is this workflow's.
        #
        # Whether one is open also decides, further down, between a fast-forward
        # and a force-push. Reading "no" when the answer is actually "gh could
        # not tell us" would force-push over an open pull request's branch and
        # throw away the reviewer's commits on it, so an answer that is not a
        # number is a hard error rather than a default.
        mine=$(gh pr list --head "$BRANCH" --state open \
          --json number,isCrossRepository,headRepositoryOwner \
          --jq '[.[] | select(.isCrossRepository == false and .headRepositoryOwner.login == env.REPO_OWNER)]')
        open_prs=$(printf '%s' "$mine" | jq 'length')
        case "$open_prs" in
          '' | *[!0-9]*)
            echo "::error::Could not determine whether a drift pull request is open (gh answered '$open_prs'). Refusing to continue: treating that as 'none open' would force-push over the branch of a pull request that may well exist."
            exit 1
            ;;
        esac

        if [ "$open_prs" -gt 0 ]; then
          # A pull request is open, so the branch is not abandoned and must not
          # be force-pushed over. If its manifest cannot be read -- the ref was
          # not fetched, or the branch does not carry the file -- that is a
          # situation to stop on and look at, not to resolve by falling through
          # to the "abandoned branch" path and overwriting a reviewer's work.
          if ! git rev-parse --verify --quiet "origin/$BRANCH" > /dev/null \
             || ! git cat-file -e "origin/$BRANCH:$MANIFEST" 2> /dev/null; then
            echo "::error::A drift pull request is open on $BRANCH, but $MANIFEST could not be read from that branch. Refusing to continue: the only other course is to treat the branch as abandoned and force-push over an open pull request."
            exit 1
          fi

          # The branch's manifest decides VALUES, never DESTINATIONS. Handing it
          # over whole would let a branch choose the URLs the step below fetches
          # from a scheduled job on the default branch -- link-local metadata,
          # something on the runner's loopback, an endpoint that records what it
          # is sent -- and the response is written into the manifest and printed
          # in the pull request body, so a read exfiltrates too. The merge keeps
          # every endpoint from the trusted checkout and takes only the recorded
          # values from the branch.
          git show "origin/$BRANCH:$MANIFEST" > "${RUNNER_TEMP}/proposed-manifest.json"
          node ./scripts/hardenDriftManifest.js \
            --trusted="$MANIFEST" \
            --proposed="${RUNNER_TEMP}/proposed-manifest.json" \
            --out="$MANIFEST"

          echo "number=$(printf '%s' "$mine" | jq -r '.[0].number')" >> "$GITHUB_OUTPUT"
          echo "existing=true" >> "$GITHUB_OUTPUT"
          echo "Continuing from the open drift pull request on $BRANCH (its $MANIFEST only; the branch is not checked out)."
        else
          echo "existing=false" >> "$GITHUB_OUTPUT"
          echo "No open drift pull request; starting from the default branch."
        fi

    # The drift checker is plain Node (no dependencies), so no install step is
    # needed. With --write it rewrites public/api/networks.json in place and
    # emits `drift` and `probe_errors` outputs. It exits non-zero when a network
    # could not be reached, but the networks that did respond are still compared
    # and can still get a PR — hence continue-on-error here, so that a partial
    # outage does not skip the PR step.
    #
    # continue-on-error means this step can no longer fail the job on its own, so
    # the last step below is what turns any non-success back into a red run. That
    # step is gated on this step's *outcome*, not on an output, so it also covers
    # failures that happen before any output is written (a malformed manifest, an
    # empty networks object, any uncaught exception).
    - name: Compare recorded versions against each network's RPC
      id: drift
      continue-on-error: true
      run: |
        set -euo pipefail
        node ./scripts/checkNetworkDrift.js --write \
          --body-file "${RUNNER_TEMP}/networks-drift-body.md" \
          --allowed-hosts="$(cat "${RUNNER_TEMP}/allowed-hosts.txt")"

    # The drift branch is written with plumbing rather than by checking it out:
    # a commit is assembled from its parent's tree with exactly one blob
    # replaced, in a scratch index, and pushed by object id. Nothing from that
    # branch ever reaches the working tree, and the manifest is the only path
    # this job can change on it no matter what else the branch contains.
    #
    # This is also the only step that sees the PAT, and it reaches git through a
    # credential helper that reads it from the environment -- never written into
    # .git/config (persist-credentials: false above) and never passed on a
    # command line where a process listing could catch it.
    - name: Commit the manifest to the drift branch and open or update the PR
      if: steps.drift.outputs.drift == 'true'
      env:
        GH_TOKEN: ${{ secrets.DOCS_AUTOMATION_TOKEN }}
        EXISTING: ${{ steps.base.outputs.existing }}
        PR_NUMBER: ${{ steps.base.outputs.number }}
        TITLE: 'Network version drift: update public/api/networks.json'
        GIT_AUTHOR_NAME: 'github-actions[bot]'
        GIT_AUTHOR_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'
        GIT_COMMITTER_NAME: 'github-actions[bot]'
        GIT_COMMITTER_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'
      run: |
        set -euo pipefail

        if [ "$EXISTING" = "true" ]; then
          # Build on the open PR's tip, so the push fast-forwards and a
          # reviewer's own commits on the branch survive.
          PARENT="origin/$BRANCH"
        else
          # No open PR, so any branch of this name is abandoned: rebuild it from
          # the trusted checkout and force-push over whatever was there.
          PARENT="HEAD"
        fi

        blob=$(git hash-object -w "$MANIFEST")

        # The chain can also drift back. If the newly probed versions are
        # exactly what the default branch already records, there is nothing left
        # to propose -- pushing anyway would leave an open pull request whose
        # only diff against its own base is a date, which reads as a bug to
        # everyone who finds it. Close it instead and let the next real change
        # open a fresh one.
        #
        # Compared on the `networks` subtree, not the whole file: a --write that
        # finds drift also stamps `updated` with today's date, so comparing the
        # blobs would say "different" on every single run and this would never
        # fire at all.
        proposed_networks=$(jq -S '.networks' < "$MANIFEST")
        base_networks=$(git show "HEAD:$MANIFEST" | jq -S '.networks')
        if [ "$proposed_networks" = "$base_networks" ]; then
          echo "The probed versions match $BASE; there is nothing to propose."
          if [ "$EXISTING" = "true" ]; then
            gh pr close "$PR_NUMBER" --comment \
              "Closing automatically: every network now reports the version already recorded on \`$BASE\`, so this pull request no longer proposes a change. A fresh one opens by itself the next time a network's version actually drifts."
            echo "Closed the now-empty drift pull request #$PR_NUMBER."
          fi
          exit 0
        fi

        GIT_INDEX_FILE="${RUNNER_TEMP}/drift-index"
        export GIT_INDEX_FILE
        rm -f "$GIT_INDEX_FILE"
        git read-tree "$PARENT"
        git update-index --add --cacheinfo "100644,$blob,$MANIFEST"
        tree=$(git write-tree)
        unset GIT_INDEX_FILE

        if [ "$tree" = "$(git rev-parse "$PARENT^{tree}")" ]; then
          echo "The drift branch already carries this manifest; nothing to push."
          exit 0
        fi

        commit=$(git commit-tree "$tree" -p "$PARENT" \
          -m 'Update deployed network versions in networks.json')

        push() {
          git -c credential.helper= \
              -c credential.helper='!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' \
              push "$@"
        }

        if [ "$EXISTING" = "true" ]; then
          push origin "$commit:refs/heads/$BRANCH"
          # By number, not by branch name -- the name could resolve to a fork's
          # pull request, and the step above already established which number is
          # actually ours.
          gh pr edit "$PR_NUMBER" --title "$TITLE" --body-file "${RUNNER_TEMP}/networks-drift-body.md"
        else
          push --force origin "$commit:refs/heads/$BRANCH"
          gh pr create --base "$BASE" --head "$BRANCH" \
            --title "$TITLE" --body-file "${RUNNER_TEMP}/networks-drift-body.md"
        fi

    # Catch-all: any non-success from the drift step ends in a red run. Gating on
    # `outcome` rather than on `outputs.probe_errors` is deliberate — an unset
    # output reads as the empty string, so an output-gated condition would be
    # false exactly when the script died before reporting anything, silently
    # skipping this step and leaving the job green.
    - name: Fail the run if the drift check did not succeed
      if: ${{ !cancelled() && steps.drift.outcome != 'success' }}
      env:
        PROBE_ERRORS: ${{ steps.drift.outputs.probe_errors }}
      run: |
        if [ -n "$PROBE_ERRORS" ]; then
          echo "::error::Could not probe: ${PROBE_ERRORS}. Other networks were still compared; see the drift step log."
        else
          echo "::error::The drift check failed before it could report per-network results (malformed manifest, or an unexpected error). See the drift step log."
        fi
        exit 1
