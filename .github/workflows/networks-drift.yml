name: Check Network Version Drift

# Opens (or updates) one long-lived pull request when a network's deployed
# version has moved ahead of public/api/networks.json.
#
# Required repository secret:
#   DOCS_AUTOMATION_TOKEN  a fine-grained PAT scoped to this repository. It is
#                          mandatory: a branch pushed with the default
#                          GITHUB_TOKEN emits no `synchronize` event, so the
#                          drift PR's checks never re-run when the nightly job
#                          refreshes it. The job fails loudly when the secret is
#                          missing rather than quietly producing an unchecked PR.

on:
  schedule:
    # Daily at 06:00 UTC, so a chain upgrade is picked up without waiting for a PR.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# One run at a time. A manual dispatch racing the scheduled one would have both
# writing the same drift branch and both calling `gh pr create`: one run's
# manifest update overwrites the other's, or the second PR creation fails.
# cancel-in-progress is false because a half-finished run leaves the branch in
# an arbitrary state -- the queued run is the one that should wait.
concurrency:
  group: networks-drift
  cancel-in-progress: false

env:
  BRANCH: networks-version-drift
  # Automation pull requests target the default branch and are only opened from
  # it. Hardcoded rather than read from github.ref_name, so a dispatch from a
  # release branch can exercise the drift check without ever proposing a merge
  # into that branch.
  BASE: main

jobs:
  networks-drift:
    runs-on: ubuntu-latest

    steps:
    # Checked first: failing here names the missing secret, instead of letting
    # it surface as an opaque checkout or push failure later. An expired PAT is
    # then a red run rather than an unchecked pull request.
    - name: Require the automation token
      env:
        DOCS_AUTOMATION_TOKEN: ${{ secrets.DOCS_AUTOMATION_TOKEN }}
      run: |
        if [ -z "$DOCS_AUTOMATION_TOKEN" ]; then
          echo "::error::The DOCS_AUTOMATION_TOKEN secret is not set. This workflow pushes a branch and opens a pull request, and a push made with the default GITHUB_TOKEN does not trigger the pull request's checks. Add the secret (a fine-grained PAT scoped to this repository) or disable this workflow."
          exit 1
        fi

    # Third-party actions are pinned to full commit SHAs: this job can write to
    # the repository, and a tag is a mutable pointer.
    #
    # Checking out with the PAT is what makes the pushes below come from the PAT
    # too (persist-credentials writes it into the remote's auth header), which
    # is what makes GitHub emit the `synchronize` event that re-runs the drift
    # pull request's checks after each refresh.
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        token: ${{ secrets.DOCS_AUTOMATION_TOKEN }}
        # Full history so the drift branch can be checked out and pushed to
        # without a shallow-clone dance.
        fetch-depth: 0

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '20'

    # If a drift PR is already open, continue from its branch instead of the
    # default branch. The drift check then compares against what that PR already
    # proposes, so an unchanged chain is a no-op: no commit, no push, no PR
    # churn. It also means a reviewer's own edits on that branch (notably the
    # deployed_version bump the PR body asks for) are built on top of rather
    # than discarded.
    - name: Continue from the open drift pull request, if there is one
      id: base
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')" -gt 0 ] \
           && git rev-parse --verify --quiet "origin/$BRANCH" > /dev/null; then
          git checkout -B "$BRANCH" "origin/$BRANCH"
          echo "existing=true" >> "$GITHUB_OUTPUT"
          echo "Continuing from the open drift pull request on $BRANCH."
        else
          echo "existing=false" >> "$GITHUB_OUTPUT"
          echo "No open drift pull request; starting from the default branch."
        fi

    # The drift checker is plain Node (no dependencies), so no install step is
    # needed. With --write it rewrites public/api/networks.json in place and
    # emits `drift` and `probe_errors` outputs. It exits non-zero when a network
    # could not be reached, but the networks that did respond are still compared
    # and can still get a PR — hence continue-on-error here, so that a partial
    # outage does not skip the PR step.
    #
    # continue-on-error means this step can no longer fail the job on its own, so
    # the last step below is what turns any non-success back into a red run. That
    # step is gated on this step's *outcome*, not on an output, so it also covers
    # failures that happen before any output is written (a malformed manifest, an
    # empty networks object, any uncaught exception).
    - name: Compare recorded versions against each network's RPC
      id: drift
      continue-on-error: true
      run: node ./scripts/checkNetworkDrift.js --write --body-file "${RUNNER_TEMP}/networks-drift-body.md"

    - name: Commit the manifest and open or update the pull request
      if: steps.drift.outputs.drift == 'true'
      env:
        GH_TOKEN: ${{ secrets.DOCS_AUTOMATION_TOKEN }}
        EXISTING: ${{ steps.base.outputs.existing }}
        TITLE: 'Network version drift: update public/api/networks.json'
      run: |
        set -euo pipefail
        # Only the default branch proposes changes. A dispatch from a release or
        # feature branch is a legitimate way to exercise the drift check, and it
        # must not push the machine branch or open a pull request off that ref.
        if [ "$GITHUB_REF_NAME" != "$BASE" ]; then
          echo "Running from '$GITHUB_REF_NAME', not the default branch ('$BASE'): drift was detected and reported in the step log, skipping the commit, the push and the pull request."
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add public/api/networks.json
        git commit -m "Update deployed network versions in networks.json"
        if [ "$EXISTING" = "true" ]; then
          # Building on the open PR's branch, so this always fast-forwards.
          git push origin "$BRANCH"
          gh pr edit "$BRANCH" --title "$TITLE" --body-file "${RUNNER_TEMP}/networks-drift-body.md"
        else
          # No open PR, so any branch of this name is abandoned and safe to reset.
          git checkout -B "$BRANCH"
          git push --force origin "$BRANCH"
          gh pr create --base "$BASE" --head "$BRANCH" \
            --title "$TITLE" --body-file "${RUNNER_TEMP}/networks-drift-body.md"
        fi

    # Catch-all: any non-success from the drift step ends in a red run. Gating on
    # `outcome` rather than on `outputs.probe_errors` is deliberate — an unset
    # output reads as the empty string, so an output-gated condition would be
    # false exactly when the script died before reporting anything, silently
    # skipping this step and leaving the job green.
    - name: Fail the run if the drift check did not succeed
      if: ${{ !cancelled() && steps.drift.outcome != 'success' }}
      env:
        PROBE_ERRORS: ${{ steps.drift.outputs.probe_errors }}
      run: |
        if [ -n "$PROBE_ERRORS" ]; then
          echo "::error::Could not probe: ${PROBE_ERRORS}. Other networks were still compared; see the drift step log."
        else
          echo "::error::The drift check failed before it could report per-network results (malformed manifest, or an unexpected error). See the drift step log."
        fi
        exit 1
