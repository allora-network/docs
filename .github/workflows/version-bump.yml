name: Check Upstream Versions

# Checks upstream release feeds once a day and reports what has moved ahead of
# public/api/versions.json. Two surfaces, because the findings are not equally
# trustworthy:
#
#   * a pull request, for versions upstream has actually published (a GitHub
#     release or tag, or a PyPI release). These are the only values the bot
#     writes, so merging can never publish a version nobody can install.
#   * a tracking issue, for everything the bot cannot assert — which release each
#     network is running, and versions read from a moving branch. These are
#     deliberately absent from the diff; a human confirms them and edits
#     public/api/versions.json directly.
#
# Both surfaces carry a fingerprint of their findings, and both are skipped when
# a human has already declined that exact proposal. Closing means closed until
# the proposed versions themselves change. The tracking issue also closes itself
# once the bot has no candidates left to report, so resolving its findings in
# public/api/versions.json is enough — nobody has to remember the issue.
#
# The pull request is opened with the DOCS_AUTOMATION_TOKEN secret (a
# fine-grained PAT scoped to this repository) so it can be created without the
# "create and approve pull requests" Actions setting, and so CI runs on it.
# The secret is required, with no fallback: a pull request created with the
# default GITHUB_TOKEN does not trigger this repository's own workflows, so the
# fallback used to produce version bumps that nothing had checked. When the
# secret is absent or expired, the run fails on the step below and names it.
#
# The whole job runs on the default branch only — see the `guard` job. A
# dispatch from any other ref does nothing at all, rather than running that
# ref's scripts with write-capable tokens in scope and mutating the shared
# pull request and tracking issue from them.

on:
  schedule:
    # 07:15 UTC daily.
    - cron: '15 7 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

# A manual run must not race the nightly one onto the same branch.
concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  # Everything past this gate checks the repository out and runs scripts from
  # that tree while write-capable tokens are available to the job -- and those
  # scripts decide what the shared pull request and tracking issue say. Only the
  # default branch's tree is trusted with that combination -- it is the one that
  # cannot change without review -- so the decision is made here, in a job with
  # no credentials, no checkout and nothing to exfiltrate. GitHub only schedules
  # workflows from the default branch, so this never blocks a nightly run; a
  # dispatch from any other ref logs one line and stops.
  guard:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      trusted: ${{ steps.check.outputs.trusted }}
    steps:
    - name: Decide whether this ref may run the job
      id: check
      env:
        # Hardcoded like the pull request base, so the gate never depends on a
        # webhook payload field being present -- but cross-checked against the
        # payload when it carries one, so renaming the default branch fails
        # loudly here instead of silently disabling the automation.
        TRUSTED_BRANCH: main
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail
        if [ -n "$DEFAULT_BRANCH" ] && [ "$DEFAULT_BRANCH" != "$TRUSTED_BRANCH" ]; then
          echo "::error::This workflow trusts '$TRUSTED_BRANCH', but the repository's default branch is '$DEFAULT_BRANCH'. Update TRUSTED_BRANCH and the pull request base in the automation workflows."
          exit 1
        fi
        if [ "$GITHUB_REF_NAME" != "$TRUSTED_BRANCH" ]; then
          echo "trusted=false" >> "$GITHUB_OUTPUT"
          echo "Dispatched from '$GITHUB_REF_NAME', not the trusted branch ('$TRUSTED_BRANCH'): doing nothing. This workflow runs repository scripts with write-capable credentials in scope and mutates a shared pull request and tracking issue, which is only safe from a ref that cannot change without review."
          exit 0
        fi
        echo "trusted=true" >> "$GITHUB_OUTPUT"

  check-versions:
    needs: guard
    if: needs.guard.outputs.trusted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    # Third-party actions are pinned to full commit SHAs: this job can write to
    # the repository, and a tag is a mutable pointer.
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        # Nothing here pushes with these credentials: peter-evans below saves,
        # unsets and restores any persisted auth and configures the token it was
        # given, so leaving a write-capable credential in .git/config while
        # bumpVersions.js runs would buy nothing and risk something.
        persist-credentials: false

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '20'

    # Plain Node (global fetch, no dependencies), so no install step is needed.
    # GITHUB_TOKEN only lifts the anonymous GitHub API rate limit; every source
    # the script reads is public.
    - name: Check upstream releases
      id: bump
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: node ./scripts/bumpVersions.js --write

    # peter-evans/create-pull-request recreates a pull request whenever a diff
    # exists and none is open — so without this guard, declining a bump would
    # earn a fresh identical pull request every morning.
    - name: Check whether this bump was already declined
      id: declined
      if: steps.bump.outputs.changed == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        MARKER: ${{ steps.bump.outputs.marker }}
      run: |
        set -euo pipefail
        count=$(gh pr list --state closed --head automated/version-bump --limit 20 \
          --json state,body \
          --jq '[.[] | select(.state == "CLOSED") | select(.body // "" | contains(env.MARKER))] | length')
        echo "count=$count" >> "$GITHUB_OUTPUT"
        if [ "$count" != "0" ]; then
          echo "This exact bump was already declined in a closed pull request; not reopening."
        fi

    # The ref is already settled by the `guard` job. What is left is the secret,
    # which the pull request step cannot check itself: `secrets` is not
    # available in an `if:`, so an absent PAT would otherwise surface as a
    # confusing failure inside the action.
    - name: Require the automation token
      if: steps.bump.outputs.changed == 'true' && steps.declined.outputs.count == '0'
      env:
        DOCS_AUTOMATION_TOKEN: ${{ secrets.DOCS_AUTOMATION_TOKEN }}
      run: |
        if [ -z "$DOCS_AUTOMATION_TOKEN" ]; then
          echo "::error::The DOCS_AUTOMATION_TOKEN secret is not set. A version-bump pull request opened with the default GITHUB_TOKEN does not trigger this repository's checks, so it would arrive with nothing verifying it. Add the secret (a fine-grained PAT scoped to this repository) or disable this workflow."
          exit 1
        fi

    - name: Open or update the bump pull request
      if: steps.bump.outputs.changed == 'true' && steps.declined.outputs.count == '0'
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        token: ${{ secrets.DOCS_AUTOMATION_TOKEN }}
        base: main
        branch: automated/version-bump
        commit-message: 'Update published versions in public/api/versions.json'
        title: 'Update published versions in versions.json'
        body: ${{ steps.bump.outputs.body }}
        add-paths: public/api/versions.json

    # Findings the bot will not write. Kept in one long-lived issue: updated in
    # place while they hold, left alone once closed unless the versions change.
    #
    # This step and the one after it mutate a surface shared with every reader
    # of the repository, so what they publish must come from the default
    # branch's scripts and nothing else. That is the `guard` job's doing: this
    # job does not run at all on any other ref, so neither issue step can
    # publish a branch-only finding or close the issue on a branch's say-so.
    - name: Open or update the version-candidates issue
      if: steps.bump.outputs.review_changed == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        ISSUE_TITLE: 'Version candidates needing human confirmation'
        ISSUE_BODY: ${{ steps.bump.outputs.review_body }}
        MARKER: ${{ steps.bump.outputs.review_marker }}
      run: |
        set -euo pipefail
        existing=$(gh issue list --state all --limit 50 --json number,title,body,state \
          --jq '[.[] | select(.title == env.ISSUE_TITLE)] | first // empty')

        if [ -z "$existing" ]; then
          gh issue create --title "$ISSUE_TITLE" --body "$ISSUE_BODY"
          exit 0
        fi

        number=$(printf '%s' "$existing" | jq -r '.number')
        if printf '%s' "$existing" | jq -r '.body // ""' | grep -qF "$MARKER"; then
          echo "Issue #$number already carries these exact findings; leaving it as-is."
          exit 0
        fi

        gh issue edit "$number" --body "$ISSUE_BODY"
        if [ "$(printf '%s' "$existing" | jq -r '.state')" = "CLOSED" ]; then
          gh issue reopen "$number"
        fi
        echo "Updated issue #$number with new findings."

    # The mirror image of the step above. A human who resolves the findings by
    # editing public/api/versions.json has no reason to remember the tracking
    # issue, so an issue full of findings the bot no longer reports would sit
    # open indefinitely, contradicting the file it is about. Nothing left to
    # confirm means the issue has done its job.
    - name: Close the version-candidates issue when nothing needs confirming
      if: steps.bump.outputs.review_count == '0'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        ISSUE_TITLE: 'Version candidates needing human confirmation'
      run: |
        set -euo pipefail
        number=$(gh issue list --state open --limit 50 --json number,title \
          --jq '[.[] | select(.title == env.ISSUE_TITLE)] | first // empty | .number')

        if [ -z "$number" ]; then
          echo "No open version-candidates issue; nothing to close."
          exit 0
        fi

        RESOLVED="Closing automatically: this run found no version candidates needing human confirmation, so every finding this issue carried is resolved. It reopens with fresh contents if new candidates appear."

        # Replace the body as well as closing it. The step above deliberately
        # leaves a closed issue alone while its body still carries the same
        # fingerprint -- that is what makes closing by hand mean "declined, do
        # not resurrect". Resolved is not declined: if the fingerprint stayed
        # behind, the same finding coming back would match a closed issue and
        # never be reported again. Clearing it makes the return of a finding a
        # genuine change, which reopens the issue.
        gh issue edit "$number" --body "$RESOLVED"
        gh issue close "$number" --comment "$RESOLVED"
        echo "Closed issue #$number."
