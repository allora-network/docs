name: Check Frontmatter

on:
  pull_request:
    branches:
      - main

jobs:
  check-frontmatter:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # The checker is plain Node (no dependencies), so no install step is needed.
    # It fails if any page under pages/ is missing the required frontmatter keys
    # (title, description, persona, verified_against, last_reviewed).
    - name: Run frontmatter check script
      run: node ./scripts/checkFrontmatter.js
