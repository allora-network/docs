name: Check and Update MDX Links

on:
  pull_request:
    branches:
      - main

jobs:
  check-mdx-links:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install

    # Fails if public/llms.txt and public/llms-full.txt no longer match the page
    # set under pages/ — i.e. a page was added, removed, renamed, retitled, or
    # edited without regenerating the bundle. Runs before the link script, which
    # rewrites .mdx files in place and would otherwise make the comparison
    # reflect uncommitted edits. The checker is plain Node with no dependencies.
    - name: Check generated llms.txt is up to date
      run: node ./scripts/generateLlmsTxt.js --check

    # Same contract for the per-page raw markdown under public/raw/: fails if a
    # page was added, renamed, removed, or edited without regenerating it, and
    # if public/raw/ still holds a file no page maps to.
    - name: Check generated raw markdown is up to date
      run: node ./scripts/generateRawMarkdown.js --check

    - name: Run MDX link check script
      run: node ./scripts/fixRelativeLinks.js
